[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scholarpath"
version = "0.1.0"
description = "AI scholarship discovery and academic guidance for students"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "LOQ" }]
dependencies = [
    "pydantic>=2.9,<3",
    # Essentials = Core/Gui/Widgets/Network. The full PySide6 meta-package adds
    # ~400 MB of WebEngine/Pdf/Multimedia this app does not use.
    "PySide6-Essentials>=6.7,<7",
    # Voice replies in live voice mode (G126): Windows SAPI speech through
    # pyttsx3. Fully offline; no cloud service, no audio leaving the device.
    "pyttsx3>=2.90,<3",
    "pywin32>=306; sys_platform == 'win32'",
    # Voice-to-text (G124): microphone capture + the free web speech engine.
    # No API key and no model download; the UI states that the audio clip is
    # sent to the transcription service. Both wheels ship for Windows/py3.11.
    "SpeechRecognition>=3.10,<4",
    "PyAudio>=0.2.14,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]
# Image-document OCR (M4) uses the Windows OCR engine through winsdk. Optional:
# without it, text-layer PDFs still parse and image files say OCR is unavailable.
ocr = [
    "winsdk>=1.0,<2.0; sys_platform == 'win32'",
]

[project.scripts]
scholarpath = "scholarpath.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
