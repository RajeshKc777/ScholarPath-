# ScholarPath AI - configuration template
#
# Copy this file to the user config location and edit it:
#   Windows: %APPDATA%\ScholarPath\config.toml
#   Other:   ~/ScholarPath/config.toml
#
# Or let the app create it for you:
#   scholarpath --init-config
#
# This template never contains real credentials. Secrets belong in the
# environment or in the local config file, never in source control.
#
# NOTE: top-level keys (such as log_level) must appear before the first
# [table] header - that is how TOML parsing works.

# --- Diagnostics ---------------------------------------------------------------
# DEBUG | INFO | WARNING | ERROR
log_level = "INFO"

# --- Model gateway -----------------------------------------------------------
[gateway]
# "stub"     = offline placeholder, no network (Milestone 1 behaviour)
# "opencode" = real model replies through a running OpenCode service (Milestone 2)
# "openai"   = direct replies from any OpenAI-compatible endpoint
provider = "stub"

# Model identifier. Use "provider/model" (for example
# "opencode/minimax-m3.1-flash-free") or a bare model id. Empty = the default
# model that OpenCode reports.
model = ""

# Failover chain, tried in order when a model is rate-limited. Empty = the
# provider's own choice first, then its free-tier models. Paid models are
# never entered automatically - name them here if you want them tried.
models = []

# How many model/account attempts one chat turn may make before the app
# reports an honest error instead of a raw rate-limit message.
failover_attempts = 6

# Per-request timeout in seconds. Also bounds how long a reply may take.
timeout_seconds = 30.0

# Retry attempts for transient failures (rate limits, timeouts).
retries = 1

# --- OpenCode adapter (only used when provider = "opencode") -----------------
# By default the running background service is discovered from its registration
# file (~/.local/state/opencode/service.json). No secret goes in this file: the
# service password is read from that registration.
base_url = ""

# Optional explicit registration file, if discovery cannot find it.
service_file = ""

# Working directory attached to OpenCode sessions. Empty = the app's directory.
location_dir = ""

# Ask the service to switch to another stored account when a model quota is
# exhausted. The app rotates between the accounts the service already knows.
rotate_credentials = true

# --- OpenAI-compatible adapter (only used when provider = "openai") ----------
# The endpoint that serves /chat/completions, for example
# http://127.0.0.1:4182/v1 for a local router.
api_base_url = ""

# The app's own API keys, tried in order. Keep them in THIS local file or in
# the SCHOLARPATH_API_KEYS environment variable - never in the repository.
api_keys = []

# --- Interface ---------------------------------------------------------------
[ui]
theme = "dark"          # dark | light | system
window_width = 1100
window_height = 720

# --- Privacy: what may leave this device -------------------------------------
# Everything here is OFF by default. Turn a switch on only if you are happy
# for that data to reach the third party named below. The Settings page shows
# the same information inside the app.
[privacy]
# Microphone audio -> Google's speech service (the clip is transcribed to text).
voice_stt = false
# Reply text -> Microsoft's speech service (the text is turned into audio).
voice_tts = false
# Search question -> the web-search service (and the pages it returns).
web_search = false

# --- Tools (MCP, optional) -----------------------------------------------------
# MCP is opt-in and read-only by default. No server starts unless mcp.enabled
# is true AND that server has enabled = true. With read_only = true, only
# tools advertising readOnlyHint in their annotations may be called.
[mcp]
enabled = false
read_only = true

# Example server entry (add one [[mcp.servers]] block per server):
# [[mcp.servers]]
# name = "docs"
# command = "python"
# args = ["-m", "docs_server"]
# enabled = false
