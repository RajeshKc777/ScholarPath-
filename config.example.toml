# ScholarPath AI - configuration template
#
# Copy this file to the user config location and edit it:
#   Windows: %APPDATA%\ScholarPath\config.toml
#   Other:   ~/ScholarPath/config.toml
#
# Or let the app create it for you:
#   scholarpath --init-config
#
# This template never contains real credentials. Secrets belong in the
# environment or in the local config file, never in source control.
#
# NOTE: top-level keys (such as log_level) must appear before the first
# [table] header - that is how TOML parsing works.

# --- Diagnostics ---------------------------------------------------------------
# DEBUG | INFO | WARNING | ERROR
log_level = "INFO"

# --- Model gateway -----------------------------------------------------------
[gateway]
# "stub"     = offline placeholder, no network (Milestone 1 behaviour)
# "opencode" = real model replies through a running OpenCode service (Milestone 2)
# "openai"   = direct replies from any OpenAI-compatible endpoint
provider = "stub"

# Never route to a provider profile that is not marked free_only. Use this
# together with profiles below; a free-only user is never failed over to a
# paid endpoint.
free_only = false

# Model identifier. Use "provider/model" (for example
# "opencode/minimax-m3.1-flash-free") or a bare model id. Empty = the default
# model that OpenCode reports.
model = ""

# Providers tried after the primary one when it is rate-limited or unreachable.
# Names must be one of: stub, opencode, openai. Empty = no provider fallback.
fallback_providers = []

# Failover chain, tried in order when a model is rate-limited. Empty = the
# provider's own choice first, then its free-tier models. Paid models are
# never entered automatically - name them here if you want them tried.
models = []

# How many model/account attempts one chat turn may make before the app
# reports an honest error instead of a raw rate-limit message.
failover_attempts = 6

# Per-request timeout in seconds. Also bounds how long a reply may take.
timeout_seconds = 30.0

# Retry attempts for transient failures (rate limits, timeouts).
retries = 1

# --- OpenCode adapter (only used when provider = "opencode") -----------------
# By default the running background service is discovered from its registration
# file (~/.local/state/opencode/service.json). No secret goes in this file: the
# service password is read from that registration.
base_url = ""

# Optional explicit registration file, if discovery cannot find it.
service_file = ""

# Working directory attached to OpenCode sessions. Empty = the app's directory.
location_dir = ""

# Ask the service to switch to another stored account when a model quota is
# exhausted. The app rotates between the accounts the service already knows.
rotate_credentials = true

# --- OpenAI-compatible adapter (only used when provider = "openai") ----------
# The endpoint that serves /chat/completions, for example
# http://127.0.0.1:4182/v1 for a local router.
api_base_url = ""

# The endpoint's own model and chain. When both are empty the endpoint
# uses "model"/"models" above instead - that is the standalone case.
api_model = ""
api_models = []

# The app's own API keys, tried in order. Keep them in THIS local file or in
# the SCHOLARPATH_API_KEYS environment variable - never in the repository.
api_keys = []

# Console keys the app registers with the model service and rotates between
# when a model quota is exhausted. Keep them here or out of the repository.
account_keys = []

# --- Provider profiles (G191) ------------------------------------------------
# Optional. Each enabled profile is an independent provider endpoint with its
# own model chain and keys. When any profile is enabled it replaces
# provider / fallback_providers above, and the app routes across profiles in
# the order written here (rate-limited ones cool down, rejected keys disable
# that profile for the session).
#
# Keys: put them in api_keys below, or in SCHOLARPATH_<NAME>_API_KEYS
# (name upper-cased, every non-alphanumeric run replaced by _). The global
# SCHOLARPATH_API_KEYS variable is NOT sent to a profile, so one provider's
# key can never reach another host.
#
# [[gateway.profiles]]
# name = "openrouter-free"
# kind = "openai"                   # openai | opencode | stub
# enabled = true
# free_only = true                  # only free models / a free endpoint
# base_url = "https://openrouter.ai/api/v1"
# model = "deepseek/deepseek-chat-v3-0324:free"
# models = []
# api_keys = []
#
# [[gateway.profiles]]
# name = "local"
# kind = "openai"
# base_url = "http://127.0.0.1:11434/v1"
# model = "qwen2.5-coder:7b"
# free_only = true

# --- Interface ---------------------------------------------------------------
[ui]
theme = "dark"          # dark | light | system
window_width = 1100
window_height = 720

# --- Privacy: what may leave this device -------------------------------------
# Everything here is ON by default so the features work without editing a file.
# The Settings page has a real toggle for each one and saves the choice here.
# Turn a switch off if you do not want that data to reach the third party named
# below. The same information is shown next to each switch inside the app.
[privacy]
# Microphone audio -> Google's speech service (the clip is transcribed to text).
voice_stt = true
# Reply text -> Microsoft's speech service (the text is turned into audio).
voice_tts = true
# Search question -> the web-search service (and the pages it returns).
web_search = true
# Profile summary -> the model service that answers your chat (a short summary
# of your saved profile: degree level, GPA and scale, nationality, preferred
# countries, funding need and language scores - never your name, never your
# documents). Turn it off and the chat is given nothing about your profile.
chat_profile = true

# --- Web search ---------------------------------------------------------------
# Domains you trust for scholarship information. They are matched exactly, on
# the registrable domain: "chevening.org" covers "www.chevening.org", and
# nothing else. University and government domains (.edu, .ac.xx, .gov,
# .gov.xx) are always treated as official-looking.
[search]
trusted_domains = []

# --- Freshness: keeping the stored records true --------------------------------
# The saved records are checked first, then the most recent ones. A page that
# changed is read again and every value is verified against the new page
# text; the older version is kept so you can still read it.
[freshness]
# Check in the background when the app starts and a record is due.
auto = true
# How old the last check of a record may be before it is due again.
interval_hours = 24
# How many records one run may read (saved records are always included).
max_per_run = 20

# --- Reminders ------------------------------------------------------------------
# OFF by default. When on, Windows shows a local notification at 30, 14, 7 and
# 1 days before the deadline of a saved record. Nothing is sent anywhere: the
# notification is drawn by Windows on this device. Only records with a clear
# deadline date are reminded about.
[reminders]
enabled = false

# --- Tools (MCP, optional) -----------------------------------------------------
# MCP is opt-in and read-only by default. No server starts unless mcp.enabled
# is true AND that server has enabled = true. With read_only = true, only
# tools advertising readOnlyHint in their annotations may be called.
[mcp]
enabled = false
read_only = true

# Example server entry (add one [[mcp.servers]] block per server):
# [[mcp.servers]]
# name = "docs"
# command = "python"
# args = ["-m", "docs_server"]
# enabled = false
